name: Bug report
description: Report a reproducible workflow, documentation, or validation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste confidential or copyrighted paper text. Prefer the synthetic fixture or a minimal original example.
  - type: input
    id: version
    attributes:
      label: Repository version or commit
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Product, model/mode, and date
      placeholder: ChatGPT, displayed mode/model, YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List available files, the exact trigger, and steps.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and evidence
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed confidential, identifying, restricted, and non-redistributable content.
          required: true

