name: Bug report
description: Report a reproducible workflow, documentation, or validation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste confidential or copyrighted paper text. Prefer the synthetic fixture or a minimal original example.
  - type: input
    id: version
    attributes:
      label: Repository version or commit
      placeholder: v0.2.0 or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: For prompt behavior, give product, displayed model/mode, and date. For local tools, give OS and Python version.
      placeholder: ChatGPT, displayed mode/model, YYYY-MM-DD; or Windows 11, Python 3.13
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Prompt behavior
        - Markdown structural check
        - Synthetic fixture assertions
        - JSON Schema or export validation
        - PDF fixture
        - Documentation or links
        - GitHub Actions or templates
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List available files, the exact trigger, and steps.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and evidence
    validations:
      required: true
  - type: textarea
    id: validator_output
    attributes:
      label: Validator output
      description: Paste relevant non-sensitive output and state the exact command. The structural score and fixture assertions are different checks.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed confidential, identifying, restricted, and non-redistributable content.
          required: true
