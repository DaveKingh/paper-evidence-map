name: New evaluation fixture
description: Propose an original or redistributable adversarial mini-paper.
title: "[Fixture]: "
labels: [fixture, evaluation]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: empirical ML, medicine, social science, etc.
    validations:
      required: true
  - type: textarea
    id: failure_modes
    attributes:
      label: Failure modes to test
    validations:
      required: true
  - type: dropdown
    id: rights
    attributes:
      label: Content status
      options:
        - Entirely original synthetic text
        - Clearly licensed for redistribution
    validations:
      required: true
  - type: textarea
    id: answer_key
    attributes:
      label: Expected findings and locations
    validations:
      required: true

